version: 2

models:
  - name: dim_date
    description: "Calendar dimension with São Paulo rodízio context per weekday."
    columns:
      - name: date_sk
        description: "Surrogate key (hash of date_day)."
        tests:
          - unique
          - not_null
      - name: date_day
        description: "Calendar date (America/Sao_Paulo)."
        tests:
          - unique
          - not_null
      - name: iso_dow
        description: "ISO weekday, 1=Mon .. 7=Sun."
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6, 7]

  - name: dim_location
    description: "Destination at neighborhood + 5-digit CEP grain (LGPD-safe)."
    tests:
      - dbt_utils.expression_is_true:
          expression: "cep5 ~ '^[0-9]{5}$'"
    columns:
      - name: location_sk
        description: "Surrogate key (hash of neighborhood + cep5)."
        tests:
          - unique
          - not_null
      - name: neighborhood
        tests:
          - not_null
      - name: cep5
        tests:
          - not_null

  - name: dim_driver
    description: >
      Driver dimension, SCD Type 2. One versioned row per
      (driver, vehicle_type, vehicle_plate) period, with a half-open validity
      window [valid_from, valid_to) and an is_current flag.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - driver_id
            - version
      - dbt_utils.expression_is_true:
          expression: "length(driver_cpf_hash) = 64"
    columns:
      - name: driver_sk
        description: "Surrogate key (hash of driver_id + version)."
        tests:
          - unique
          - not_null
      - name: driver_id
        description: "Natural/business key, stable across versions."
        tests:
          - not_null
      - name: version
        tests:
          - not_null
      - name: driver_cpf_hash
        description: "SHA-256 (hex) of the driver CPF; 64 hex chars."
        tests:
          - not_null
      - name: vehicle_type
        tests:
          - not_null
          - accepted_values:
              values: ['MOTORCYCLE', 'VAN', 'TRUCK']
      - name: valid_from
        tests:
          - not_null
      - name: valid_to
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null

  - name: fct_deliveries
    description: "Delivery fact — one row per delivery event."
    columns:
      - name: delivery_sk
        description: "Surrogate key (hash of event_id)."
        tests:
          - unique
          - not_null
      - name: event_id
        description: "Degenerate dimension: the source event's natural key."
        tests:
          - unique
          - not_null
      - name: date_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_sk
      - name: driver_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_driver')
              field: driver_sk
      - name: location_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_sk
      - name: status
        tests:
          - accepted_values:
              values: ['DELIVERED', 'FAILED']
      - name: vehicle_type
        tests:
          - accepted_values:
              values: ['MOTORCYCLE', 'VAN', 'TRUCK']
      - name: delivery_minutes
        tests:
          - not_null