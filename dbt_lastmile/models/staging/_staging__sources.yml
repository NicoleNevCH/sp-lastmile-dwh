version: 2

sources:
  - name: raw
    description: "Landing zone populated by the Spring Boot chaos engine. Append-only, untransformed."
    schema: raw
    tables:
      - name: delivery_events
        description: "One row per simulated delivery event, with unmasked PII and raw GPS/time data."
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 24, period: hour }
        columns:
          - name: event_id
            description: "Natural key of the event."
            tests:
              - unique
              - not_null
          - name: driver_id
            description: "Stable business key of the driver across modal changes."
            tests:
              - not_null
          - name: vehicle_plate
            tests:
              - not_null
          - name: vehicle_type
            tests:
              - accepted_values:
                  values: ['MOTORCYCLE', 'VAN', 'TRUCK']
          - name: latitude
            tests:
              - not_null
          - name: longitude
            tests:
              - not_null
          - name: dispatched_at
            tests:
              - not_null
          - name: delivered_at
            tests:
              - not_null
